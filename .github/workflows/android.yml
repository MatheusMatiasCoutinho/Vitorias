# Integração contínua: compila o app e roda os testes a cada push e Pull Request.
# O APK de debug gerado fica disponível para download na aba Actions.
name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:   # permite rodar manualmente pela aba Actions

# Se chegar um push novo na mesma branch, cancela o build antigo
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configurar Gradle (com cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Testes unitários
        run: ./gradlew testDebugUnitTest

      - name: Gerar APK de debug
        run: ./gradlew assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: vitorias-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
